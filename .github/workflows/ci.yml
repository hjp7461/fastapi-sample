name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + type + test + alembic + sdk
    runs-on: ubuntu-latest
    services:
      # PR #N: Postgres 마이그레이션 회귀 가드 (RUNBOOK §7 후속).
      # alembic upgrade head / downgrade base 의 Postgres 동작 검증용.
      # 사용자/운영 pytest 는 SQLite 인메모리 유지 (conftest.py) — services 는
      # 본 job 의 Postgres alembic step 에서만 사용 (idle 비용 = 컨테이너 1개).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v4
        with:
          # 로컬 mise 의 uv 버전과 일치 (lockfile drift 방지).
          # 새 uv 가 exclude-newer 자동 제거하는 동작이 로컬 0.11.15 의 자동 추가와 충돌.
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python (mise .mise.toml 일치)
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --all-extras --frozen

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: mypy-${{ runner.os }}-

      - name: pre-commit (ruff + 위생 hooks + mypy app/ tests/ scripts/)
        # --no-sync: uv 0.11.x 가 `uv run` 의 sync 단계에서 lockfile 의
        # [options]/exclude-newer 자동 추가/제거 → CI cache 와 drift (PR #48).
        # 직전 step 의 `uv sync --frozen` 가 venv 보장.
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: pytest
        run: uv run --no-sync pytest -q

      - name: alembic upgrade head + downgrade base (SQLite smoke)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./_ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          rm -f _ci.db

      # --- PR #N: Postgres 마이그레이션 회귀 가드 (RUNBOOK §7) ---
      # SQLite 호환만으로 Postgres 정상 동작이 보장되지 않음 (Enum 등은 Postgres
      # 에서 별도 type 으로 만들어지고 alembic 자동 DROP 누락 가능). 옵션 6.3-β
      # 의 잔존 객체 검증으로 downgrade 결함 (테이블/enum DROP 누락) 자동 catch.
      - name: alembic upgrade head + downgrade base (Postgres smoke + 잔존 객체 검증)
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          PGPASSWORD: ci
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          # 잔존 사용자 테이블 0건 검증 (alembic_version 메타 테이블은 alembic 표준상 잔존 가능 — 제외).
          remaining_tables=$(psql -h localhost -U ci -d ci -At -c \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename NOT LIKE 'alembic%';")
          if [ "$remaining_tables" != "0" ]; then
            echo "::error::Postgres downgrade 후 잔존 테이블 ${remaining_tables}건 (DROP 누락)"
            exit 1
          fi
          # 잔존 enum type 0건 검증 (DROP TYPE 누락 catch — Postgres-specific 결함).
          remaining_enums=$(psql -h localhost -U ci -d ci -At -c \
            "SELECT count(*) FROM pg_type WHERE typname IN ('productcategory','userrole');")
          if [ "$remaining_enums" != "0" ]; then
            echo "::error::Postgres downgrade 후 잔존 enum type ${remaining_enums}건 (DROP TYPE 누락)"
            exit 1
          fi

      # --- PR #N: SDK CI 통합 (typescript-fetch dry-run) ---
      # OpenAPI schema 결함 (예: $ref cycle / 예약어 operationId / generator 거부
      # 타입 조합) 을 외부 클라이언트 도입 시점이 아닌 결함 유발 PR 에서 즉시 차단.
      # 검증 깊이: dry-run (SDK 생성 + tsc --noEmit, runtime 실행 / e2e 없음).
      - name: Export OpenAPI schema
        run: uv run --no-sync python scripts/export_openapi.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache openapi-generator-cli jar
        uses: actions/cache@v4
        with:
          path: ~/.openapi-generator
          key: openapi-generator-${{ runner.os }}-v7

      - name: Generate TypeScript SDK (typescript-fetch)
        # `npmName` 추가 속성으로 package.json + tsconfig.json 동시 생성
        # (이후 step 의 `npm install + tsc --noEmit` 가 동작하도록).
        run: |
          npx --yes @openapitools/openapi-generator-cli generate \
            -i openapi.json \
            -g typescript-fetch \
            -o /tmp/sdk \
            --additional-properties=npmName=@fastapi-sample/sdk,npmVersion=0.0.1,supportsES6=true

      - name: Compile SDK (dry-run, tsc --noEmit)
        working-directory: /tmp/sdk
        run: |
          npm install --silent
          npx tsc --noEmit
