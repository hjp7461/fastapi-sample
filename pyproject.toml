[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 패키지 이름과 디렉토리 이름이 다른 경우
# my_project 아래 app 폴더 안에 main.py가 포함된 소스 디렉토리 이기 때문에 app으로 지정 .
[tool.hatch.build.targets.wheel]
packages = ["app"]

#만약 소스 코드가 src/my_project 디렉토리에 있다면, 다음과 같이 설정합니다.
#[tool.hatch.build.targets.wheel]
#packages = ["src/my_project"]

# 만약 특정 파일만 포함하고 싶다면 include 설정을 사용합니다.
#[tool.hatch.build.targets.wheel]
#include = ["my_project", "README.md"] # my_project 디렉토리와 README.md 파일 포함

[project]
name = "my-project"
version = "0.1.0"
description = "FastAPI 클린 아키텍처 예제 애플리케이션"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    # FastAPI 및 관련 라이브러리
    "fastapi>=0.95.1",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0.0",

    # 데이터베이스 및 ORM
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.8",
    "alembic>=1.10.4",
    "aiosqlite>=0.18.0",
    "greenlet>=2.0.2",

    # 인증 및 보안
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0",
    "pyjwt>=2.6.0",

    # 설정 및 유틸리티
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # 의존성 주입
    "dependency-injector>=4.41.0",

    # HTTP 클라이언트
    "httpx>=0.24.0",

    # 로깅
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.2.0",
    "pre-commit>=4.0",
    "ruff>=0.6.0",
]

test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "pytest-html>=4.1.1",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_optional = true
# pythonpath=["."] + app/ 패키지 구조에서 발생하는 모듈명 중복 해결.
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "sqlmodel.*", "alembic.*", "dependency_injector.*", "jose.*", "loguru.*"]
ignore_missing_imports = true

# sqlmodel/sqlalchemy stub 한계 — repository 의 select().where(Model.f == v)
# 비교가 bool 로 추론되어 arg-type 위반 다수. 코드는 정확. stub 개선 시 제거.
[[tool.mypy.overrides]]
module = ["app.user.repository", "app.product.repository"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = [
  "."
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
# B008: FastAPI 의 Depends() / Field() 등은 함수 시그니처 기본값에 함수 호출이
# 들어가는 것이 표준 패턴이라 본 룰의 의도와 다름.
ignore = ["B008"]
